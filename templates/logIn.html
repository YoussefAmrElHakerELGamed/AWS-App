<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>File fetch | login</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <header class="header">
            <label><b><h1>File fetch</h1></b></label>
        </header>
        <main>
            <form class="login">
                <label class="Walcom">Wolcome</label>
                <div class="Username-input">
                    <label for="username-input-field">Username</label>
                    <input class="username-field" id="username-input-field" type="text" required>
                </div>
                <div class="Password-input">
                    <label for="password-input-field">password</label>
                    <input class="password-field" id="password-input-field" type="password" required>
                </div>
                <div class="Button-container">
                    <input class="logIn-button" id="login-button-input" type="submit" value="login">
                </div>
            </form>
            <div class="signUp-button">
                <form class="signUp-container" id="signup-form" action="./signUp.html">
                    <input class="signUp-button" id="signUp-button-input" type="submit" value="Sign up">
                </form>
            </div>
        </main>
        <link rel="stylesheet" href="../static/style.css">
        <script>
            let username = document.getElementById("username-input-field").value;
            let password = document.getElementById("password-input-field").value;
            let logIn_button = document.getElementById("login-button-input").addEventListener('submit',(evt)=>{
                fetch('http://localhost:5000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({username,password})
                }).then(res => res.json()).then(data => {
                    if(data.error){
                        alert(data.error);
                    }else{
                        if(!data.authenticated){
                            alert('username or password is invalud');
                        }else{
                            window.location.href = './MainPage.html';
                        }
                    }
                });
            });
        </script>
    </body>
</html>
