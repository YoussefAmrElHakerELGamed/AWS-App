<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>File Fetch | Main</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body id="Mainpage">
        <header class="header">
            <label><b><h1>File fetch</h1></b></label>
        </header>
        <div class="userInput">
            <label class="Username">Hello there</label>
            <form class="upload-container" id="Upload form" enctype="multipart/form-data">
                <input class="Uploud-button" id="Uploud-field" type="file" title="Upload a file" accept=".jpg,.jpeg,.png,.pdf,.mp3,.mp4" required>
                <input class="Uploud-button" id="uploud-button-input" type="submit" value="uploud">
            </form>
        </div>
        <div class="files-space" id="files-space">
            <label class="no-files" id="no-files-uplouded-warning"><b>no files uplouded yet</b></label>
        </div>
        <link rel="stylesheet" href="../static/style.css">
        <script>
            document.addEventListener("DOMContentLoaded", () => {
            refreshFileList();

            const uploadForm = document.getElementById("upload-form");
            if (uploadForm) {
                uploadForm.addEventListener("submit", async (event) => {
                event.preventDefault();

                const fileInput = document.getElementById("Uploud-field");
                const uploadedFile = fileInput?.files[0];

                if (!uploadedFile) {
                    alert("Please select a file to upload.");
                    return;
                }

                try {
                    const formData = new FormData();
                    formData.append("file", uploadedFile);

                    const response = await fetch("http://18.208.253.141/upload", {
                    method: "POST",
                    body: formData,
                    });

                    const data = await response.json();

                    if (data?.error) {
                    alert("Upload failed. Please try again.");
                    } else if (data?.message === "File uploaded successfully") {
                    alert(data.message);
                    refreshFileList();
                    }
                } catch (error) {
                    console.error("Upload error:", error);
                    alert("An unexpected error occurred during upload.");
                }
                });
            }
            });

            async function refreshFileList() {
            try {
                const response = await fetch("http://18.208.253.141/list_files", {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                },
                });

                const data = await response.json();
                const fileSpace = document.getElementById("files-space");
                fileSpace.innerHTML = "";

                if (data?.files?.length > 0) {
                data.files.forEach((file) => {
                    const fileContainer = document.createElement("div");
                    fileContainer.className = "file-details";

                    fileContainer.innerHTML = `
                    <div class="file-info">
                        <label class="filename" id="title-${file.filename}">${file.filename}</label>
                        <label class="file-upload-datetime" id="last-modified-${file.filename}">${file.last_modified}</label>
                    </div>
                    <div class="file-actions">
                        <input type="button" class="delete-file" value="Delete" title="This action CANNOT be undone" />
                        <input type="button" class="share-file" value="Share" />
                    </div>
                    `;

                    fileSpace.appendChild(fileContainer);

                    fileContainer.querySelector(".delete-file").addEventListener("click", async () => {
                    await fetch(`http://18.208.253.141/delete/${encodeURIComponent(file.filename)}`, {
                        method: "GET",
                    });
                    refreshFileList();
                    });

                    fileContainer.querySelector(".share-file").addEventListener("click", async () => {
                    const res = await fetch(`http://18.208.253.141/share/${encodeURIComponent(file.filename)}`, {
                        method: "GET",
                    });
                    const result = await res.json();
                    if (result?.url) {
                        await fallbackCopyToClipboard(result.url);
                        alert("The URL has been copied to your clipboard.");
                    } else {
                        alert("Failed to retrieve shareable URL.");
                    }
                    });
                });

                const warning = document.getElementById("no-files-uploaded-warning");
                if (warning) warning.remove();
                } else {
                if (!document.getElementById("no-files-uploaded-warning")) {
                    const label = document.createElement("label");
                    label.textContent = "No files uploaded yet.";
                    label.id = "no-files-uploaded-warning";
                    label.className = "no-files";
                    fileSpace.appendChild(label);
                }
                }
            } catch (err) {
                console.error("Error fetching file list:", err);
            }
        }

        </script>
    </body>
</html>
